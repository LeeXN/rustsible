- hosts: all
  gather_facts: false
  serial: [2, 1]
  tasks:
    - command: test -f @OUTPUT@/handled-a
      when: inventory_hostname in ['c', 'd']
    - command: /bin/echo '{{ inventory_hostname }}'
      run_once: true
      register: leader
      notify: finish
    - copy:
        content: '{{ ansible_play_batch | join(",") }}|{{ leader.stdout }}'
        dest: '@OUTPUT@/batch-{{ inventory_hostname }}'
  handlers:
    - name: finish
      copy:
        content: handled
        dest: '@OUTPUT@/handled-{{ inventory_hostname }}'
- hosts: all
  gather_facts: false
  serial: '50%'
  tasks:
    - copy:
        content: '{{ ansible_play_batch | join(",") }}'
        dest: '@OUTPUT@/percentage-{{ inventory_hostname }}'
- hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - block:
        - command: /bin/false
          when: inventory_hostname == 'a'
      rescue:
        - copy:
            content: rescued
            dest: '@OUTPUT@/rescued'
      always:
        - copy:
            content: always
            dest: '@OUTPUT@/always-{{ inventory_hostname }}'
    - copy:
        content: completed
        dest: '@OUTPUT@/completed-{{ inventory_hostname }}'

