- hosts: all
  gather_facts: false
  tasks:
    - file:
        path: '@OUTPUT@/nested/child/'
        state: directory
        mode: '0750'
    - copy:
        content: "keep\r\nkey=one\r\nkey=two\r\ntail"
        dest: '@OUTPUT@/lines'
        mode: '0751'
    - lineinfile:
        path: '@OUTPUT@/lines'
        regexp: '^key='
        line: key=last
    - lineinfile:
        path: '@OUTPUT@/lines'
        insertafter: '^key='
        line: inserted
    - lineinfile:
        path: '@OUTPUT@/lines'
        regexp: '^does-not-match'
        line: inserted
    - lineinfile:
        path: '@OUTPUT@/lines'
        regexp: '^key=one$'
        state: absent
    - copy:
        content: must-not-overwrite
        dest: '@OUTPUT@/lines'
        force: false
    - copy:
        content: no-newline
        dest: '@OUTPUT@/no-newline'
    - lineinfile:
        path: '@OUTPUT@/no-newline'
        line: no-newline
    - copy:
        content: tail
        dest: '@OUTPUT@/bof'
    - lineinfile:
        path: '@OUTPUT@/bof'
        line: first
        insertbefore: BOF
    - file:
        path: '@OUTPUT@/link'
        state: link
        src: '@OUTPUT@/lines'
    - file:
        path: '@OUTPUT@/missing/child'
        state: absent
    - lineinfile:
        path: '@OUTPUT@/no-newline'
        line: no-newline
        mode: '0640'
        backup: true
