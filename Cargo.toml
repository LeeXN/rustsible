[package]
name = "rustsible"
version = "0.1.0"
edition = "2021"
authors = ["LeeXN"]
description = "An Ansible-inspired automation tool written in Rust"
readme = "README.md"
license = "MIT"
repository = "https://github.com/LeeXN/rustsible"

[dependencies]
clap = "4.4"
serde = "1.0"
serde_yaml = "0.9"
serde_json = "1.0"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
anyhow = "1.0"
tera = { version = "2.1.1", features = ["unicode"] }
log = "0.4"
libc = "0.2"
env_logger = "0.10"
regex = "1.9"
chrono = "0.4.41"
uuid = { version = "1.4", features = ["v4"] }
colored = "3.0.0"
sha-crypt = "0.5.0"

[dev-dependencies]
mockall = "0.12"
proptest = "1.4"
tempfile = "3.8"
