[workspace]
members = [".", "crates/protocol", "crates/worker"]
resolver = "2"

[package]
name = "rustsible"
version = "0.1.0"
edition = "2021"
authors = ["LeeXN"]
description = "An Ansible-inspired automation tool written in Rust"
readme = "README.md"
license = "MIT"
repository = "https://github.com/LeeXN/rustsible"

[dependencies]
rustsible-protocol = { path = "crates/protocol" }
clap = "4.4"
serde = "1.0"
serde_yaml = "0.9"
serde_json = "1.0"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
anyhow = "1.0"
log = "0.4"
libc = "0.2"
env_logger = "0.10"
regex = "1.9"
chrono = "0.4.41"
colored = "3.0.0"
sha-crypt = "0.5.0"
minijinja = { version = "=3.0.4", features = ["serde", "unicode", "fuel", "unstable_machinery"] }
rpassword = "7.5.4"
aes = { version = "0.8", features = ["zeroize"] }
ctr = "0.9"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"
getrandom = "0.4"
tempfile = "3.8"

[dev-dependencies]
mockall = "0.12"
proptest = "1.4"
