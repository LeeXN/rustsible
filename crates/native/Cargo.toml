[package]
name = "rustsible-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
[dependencies]
anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
rustsible-protocol = { path = "../protocol" }
tempfile = "3.8"
serde_json = "1.0"
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.9"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
