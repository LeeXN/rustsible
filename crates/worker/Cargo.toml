[package]
name = "rustsible-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rustsible-protocol = { path = "../protocol" }
rustsible-native = { path = "../native" }
anyhow = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
libc = "0.2"
chrono = "0.4.41"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
tempfile = "3.8"

regex = "1.9"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

[dev-dependencies]
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.9"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
