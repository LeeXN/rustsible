- hosts: localhost
  gather_facts: false
  pre_tasks:
    - file:
        path: '{{ demo_output }}'
        state: directory
        mode: '0700'
  roles:
    - role: web
      greeting: hello
  tasks:
    - include_tasks: tasks/health.yml
    - block:
        - name: demonstrate a recoverable failure
          command: /bin/false
          when: not ansible_check_mode
      rescue:
        - debug:
            msg: 'Recovered {{ ansible_failed_task.name }} (rc={{ ansible_failed_result.rc }})'
      always:
        - debug:
            msg: 'Deployment example finished'

