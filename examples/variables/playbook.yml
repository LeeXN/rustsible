- hosts: all
  gather_facts: false
  vars:
    message: hello
    selected: [one, two]
  tasks:
    - set_fact:
        persistent_message: '{{ message }}'
    - copy:
        content: '{{ item }}'
        dest: '{{ demo_root }}/{{ item }}'
        mode: '0600'
      loop: '{{ selected }}'
      register: written
    - assert:
        that: written.results | length == 2
- hosts: all
  gather_facts: false
  tasks:
    - assert:
        that: persistent_message == 'hello'
