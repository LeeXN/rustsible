---
- name: Update files without losing executable permissions
  hosts: all
  gather_facts: false
  tasks:
    - name: Create a small executable
      copy:
        content: "#!/bin/sh\nprintf 'version one\\n'\n"
        dest: /tmp/rustsible-safe-example
        mode: '0755'
    - name: Replace content while preserving its permissions
      copy:
        content: "#!/bin/sh\nprintf 'version two\\n'\n"
        dest: /tmp/rustsible-safe-example
