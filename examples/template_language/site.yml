- name: Deploy resources relative to this task file
  hosts: all
  gather_facts: false
  vars:
    version_string: '0012'
    service_port: 8080
  tasks:
    - copy:
        src: message.txt
        dest: /tmp/rustsible-template-source-example
    - template:
        src: config.j2
        dest: /tmp/rustsible-template-config-example
        mode: '{{ config_mode | default(omit) }}'
