- name: Override inventory connection settings through play variables
  hosts: localhost
  gather_facts: false
  vars:
    selected_transport: local
    ansible_connection: '{{ selected_transport }}'
    ansible_host: localhost
  tasks:
    - copy:
        content: 'Executed through {{ ansible_connection }} for {{ ansible_host }}'
        dest: /tmp/rustsible-effective-connection-example
