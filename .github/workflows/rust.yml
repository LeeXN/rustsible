name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test, and build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build native test workers
        run: cargo build --workspace --locked
      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Enforce line coverage baseline
        run: cargo llvm-cov --workspace --all-targets --all-features --locked --fail-under-lines 80
      - name: Build release binary
        run: cargo build --workspace --release --all-features --locked

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit Cargo.lock
        run: cargo audit

  ssh:
    name: SSH and become acceptance (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --workspace --release --target ${{ matrix.target }} --locked
      - name: Build native HTTP acceptance fixture
        run: cargo build -p rustsible-worker --example http_fixture --release --target ${{ matrix.target }} --locked
      - name: Build controlling terminal acceptance fixture
        run: cargo build --example prompt_fixture --release --target ${{ matrix.target }} --locked
      - name: Assemble native worker directory
        run: cargo run --locked -p rustsible-protocol --example worker_manifest -- target/workers ${{ matrix.arch }}=target/${{ matrix.target }}/release/rustsible-worker
      - name: Existing SSH scenarios
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers
      - name: SSH connection reuse and reset acceptance
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers sessions
      - name: Task controls over SSH and three execution identities
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers controls
      - name: Variable sources, facts and configuration precedence over SSH
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers variables
      - name: Variable sources and facts without Python on musl
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers variables musl
      - name: Imported tasks, roles, handler phases and failure recovery
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers reuse
      - name: Imported tasks, roles and recovery on musl
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers reuse musl
      - name: Three-server rolling deployment and delegation
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers strategy
      - name: Three-server rolling deployment and delegation on musl
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers strategy musl
      - name: Native async jobs, identity isolation and disconnect survival
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers async
      - name: Native async jobs and cleanup on musl
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers async musl
      - name: Native groups and controller assertions
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers basic
      - name: Native groups and assertions on musl
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers basic musl
      - name: Target HTTP health checks and wait conditions
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers network glibc target/${{ matrix.target }}/release/examples/http_fixture
      - name: Target HTTP health checks and wait conditions on musl
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers network musl target/${{ matrix.target }}/release/examples/http_fixture
      - name: Git and safe archive deployment over SSH
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers artifacts
      - name: Git and safe archive deployment on musl
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers artifacts musl
      - name: Tags, diff, private keys and hidden SSH/sudo prompts
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers operator glibc target/${{ matrix.target }}/release/examples/prompt_fixture
      - name: Operator CLI on musl
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers operator musl target/${{ matrix.target }}/release/examples/prompt_fixture
      - name: Vault encrypted deployment and controller atomic rewrites
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers vault glibc target/${{ matrix.target }}/release/examples/prompt_fixture
      - name: Vault deployment on musl without Python
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers vault musl target/${{ matrix.target }}/release/examples/prompt_fixture
      - name: Assemble the native example collection without executing its programs
        run: |
          cp -R examples/native-collection "${{ runner.temp }}/native-example-collection"
          cargo run --locked -p rustsible-native-example --example collection_manifest -- "${{ runner.temp }}/native-example-collection" ${{ matrix.arch }}=target/${{ matrix.target }}/release/rustsible-example-extension
      - name: Native collections, providers and async over SSH
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers extensions glibc "${{ runner.temp }}/native-example-collection"
      - name: Native collections without Python or curl on musl
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers extensions musl "${{ runner.temp }}/native-example-collection"
      - name: Native execution without Python or curl (glibc)
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers native glibc target/${{ matrix.target }}/release/examples/http_fixture
      - name: Native execution without Python or curl (musl)
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers native musl target/${{ matrix.target }}/release/examples/http_fixture
      - name: Native accounts, packages and real systemd acceptance
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers systems glibc target/${{ matrix.target }}/release/examples/http_fixture
      - name: Native accounts, signed APK and OpenRC acceptance
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers systems musl target/${{ matrix.target }}/release/examples/http_fixture
      - name: Native SysV service lifetime acceptance
        run: bash tests/ssh/run.sh target/${{ matrix.target }}/release/rustsible target/workers systems sysv target/${{ matrix.target }}/release/examples/http_fixture
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/rustsible
            target/${{ matrix.target }}/release/rustsible-worker
            target/${{ matrix.target }}/release/rustsible-example-extension
          if-no-files-found: error

  system-tools:
    name: Real RPM, Pacman and Upstart acceptance
    needs: ssh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: native-x86_64
          path: target/native
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build -p rustsible-worker --example http_fixture --release --target x86_64-unknown-linux-musl --locked
      - run: cargo run --locked -p rustsible-protocol --example worker_manifest -- target/workers x86_64=target/native/rustsible-worker
      - name: Real package managers with isolated offline repositories
        run: |
          chmod +x target/native/rustsible target/native/rustsible-worker
          for manager in dnf yum pacman zypper; do
            bash tests/managers/run.sh target/native/rustsible target/workers "$manager"
          done
      - name: Real Upstart PID 1 and daemon lifetime
        run: bash tests/managers/upstart.sh target/native/rustsible target/workers target/x86_64-unknown-linux-musl/release/examples/http_fixture

  offline-packages:
    name: Dual architecture offline packages
    needs: [quality, ssh]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: target/native
      - name: Package both controllers with both static workers
        run: |
          for arch in x86_64 aarch64; do
            bash scripts/package.sh target/native/native-$arch/rustsible "$RUNNER_TEMP/rustsible-packages/$arch" target/native/native-x86_64/rustsible-worker target/native/native-aarch64/rustsible-worker
          done
      - name: Build and verify a dual architecture native collection package
        run: |
          cp -R examples/native-collection "$RUNNER_TEMP/native-example"
          cargo run --locked -p rustsible-native-example --example collection_manifest -- "$RUNNER_TEMP/native-example" x86_64=target/native/native-x86_64/rustsible-example-extension aarch64=target/native/native-aarch64/rustsible-example-extension
          "$RUNNER_TEMP/rustsible-packages/x86_64/rustsible" collection pack "$RUNNER_TEMP/native-example" --output "$RUNNER_TEMP/rustsible-packages/example.native-0.1.0.tar.gz"
          "$RUNNER_TEMP/rustsible-packages/x86_64/rustsible" collection verify "$RUNNER_TEMP/rustsible-packages/example.native-0.1.0.tar.gz"
      - name: Run the extracted package offline without Python or curl
        run: |
          mkdir "$RUNNER_TEMP/rustsible-extracted"
          tar -xzf "$RUNNER_TEMP/rustsible-packages/x86_64.tar.gz" -C "$RUNNER_TEMP/rustsible-extracted"
          docker pull alpine:3.22
          docker run --rm --network none --mount type=bind,src="$RUNNER_TEMP/rustsible-extracted/x86_64",dst=/release,readonly --mount type=bind,src="$RUNNER_TEMP/rustsible-packages/example.native-0.1.0.tar.gz",dst=/native.tar.gz,readonly alpine:3.22 sh -eu -c '
            ! command -v python3
            ! command -v curl
            cd /release
            sha256sum -c SHA256SUMS
            printf "localhost ansible_connection=local\n" > /tmp/inventory
            ./rustsible ad-hoc localhost -m setup -i /tmp/inventory
            ./rustsible ad-hoc localhost -m stat -a "path=/etc/passwd checksum_algorithm=sha256" -i /tmp/inventory
            ./rustsible collection install /native.tar.gz --path /tmp/collections
            ./rustsible ad-hoc localhost -m example.native.probe -a "path=/etc/passwd" -i /tmp/inventory --collections-path /tmp/collections
            [ -z "$(find /tmp -name ".rustsible-worker-*")" ]
          '
      - uses: actions/upload-artifact@v4
        with:
          name: offline-linux-packages
          path: ${{ runner.temp }}/rustsible-packages/*.tar.gz
          if-no-files-found: error

  ansible-reference:
    name: Pinned Ansible 2.21 file/template comparison
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
      - run: cargo build --workspace --locked
      - run: cargo build --locked -p rustsible-worker --example http_fixture
      - run: cargo run --locked -p rustsible-protocol --example worker_manifest -- target/debug/workers x86_64=target/debug/rustsible-worker
      - run: bash tests/reference/run.sh target/debug/rustsible
